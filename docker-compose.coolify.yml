name: sasa-by-sakshi

services:
  # ─── Medusa Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    expose:
      - "9000"
    environment:
      - NODE_ENV=production
      - MEDUSA_BACKEND_URL=${MEDUSA_BACKEND_URL:-https://sasaapi.sanjayguwaju.com.np}
      - STORE_CORS=${STORE_CORS:-http://localhost:8000,http://localhost:8001,https://sasa.sanjayguwaju.com.np}
      - ADMIN_CORS=${ADMIN_CORS:-http://localhost:9000,https://sasaapi.sanjayguwaju.com.np}
      - AUTH_CORS=${AUTH_CORS:-http://localhost:9000,http://localhost:8000,http://localhost:8001,https://sasa.sanjayguwaju.com.np,https://sasaapi.sanjayguwaju.com.np}
    volumes:
      - shared_data:/shared
    networks:
      - coolify
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s

  # ─── Next.js Storefront ────────────────────────────────────────────────────
  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=8000
      - MEDUSA_SERVER_URL=${MEDUSA_SERVER_URL:-http://backend:9000}
      - NEXT_PUBLIC_MEDUSA_BACKEND_URL=${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-https://sasaapi.sanjayguwaju.com.np}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-https://sasa.sanjayguwaju.com.np}
      - NEXT_PUBLIC_DEFAULT_REGION=${NEXT_PUBLIC_DEFAULT_REGION:-np}
      - NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-pk_4793917b891e38bd6da3c748ecc6884de919e11eedbed763bb54ed9652e7ea2c}
    networks:
      - coolify
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - shared_data:/shared

volumes:
  shared_data:

networks:
  coolify:
    name: coolify
    external: true
